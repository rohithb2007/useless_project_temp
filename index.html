<!DOCTYPE html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KALLA CHIRI — Chiri Forensics Department</title>
    <meta name="description" content="Mobile-first forensic web app investigating whether a smile is genuine or a Kalla Chiri using MediaPipe landmark analysis and Gemini AI." />
    <!-- Immediate Theme Initializer to prevent Theme Flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kalla_chiri_theme');
          var theme = (saved === 'night' || saved === 'dark') ? 'night' : 'day';
          document.documentElement.dataset.theme = theme;
          if (theme === 'night') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased overflow-x-hidden selection:bg-[#D99A00] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
